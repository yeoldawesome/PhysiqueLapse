[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physiquelapse"
version = "0.1.1"
description = "Local-only physique progress tracker: upload, date, pose, align, time-lapse."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pillow>=11.1",
  "pillow-heif>=0.20",
  "imagehash>=4.3",
  # MediaPipe is pinned to 0.10.21 on purpose: every newer release (0.10.30+, 1.x)
  # embeds a Clearcut logging client that uploads usage metrics to
  # play.googleapis.com/log with no opt-out API. 0.10.21 was verified clean by
  # searching its binaries. Its pins force numpy<2 and protobuf<5 below.
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "scipy>=1.12",
  "protobuf>=4.25.3,<5",
  "opencv-contrib-python>=4.10,<5",
  # PyTorch + open_clip: CLIP from source and the ONNX export at build time. PyTorch has no
  # Intel-Mac builds past 2.2, so there CLIP runs only from the ONNX files (the Intel Mac app
  # ships them, exported on another machine).
  "torch>=2.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "open_clip_torch>=2.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  # MediaPipe depends on jax; jaxlib's last Intel-Mac build is 0.4.38, and without this pin pip
  # spends many minutes trying every newer jax release before settling on it
  "jax<0.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "jaxlib<0.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # (also MediaPipe's: 0.2.3+ has no Intel-Mac build and compiles from source for ~15 min)
  "sentencepiece<0.2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "imageio-ffmpeg>=0.5",
  # CLIP on any GPU without PyTorch (see app/services/clip_backend.py). On Windows the DirectML
  # build (NVIDIA, AMD, Intel GPUs; falls back to the CPU); it replaces the plain package there.
  "onnxruntime-directml>=1.20; sys_platform == 'win32'",
  "onnxruntime>=1.18; sys_platform != 'win32'",
  "ftfy>=6.1",
  "regex",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "onnx>=1.16"]
rembg = ["rembg>=2.0.60"]
# desktop app: native window (Windows WebView2) + the bundler that builds the .exe
# (onnx: scripts/export_clip_onnx.py, run by build.ps1 before freezing)
desktop = ["pywebview>=5.3", "pyinstaller>=6.10", "onnx>=1.16"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded model files (deselect with -m 'not models')",
  "slow: exports full-size models (run with -m slow)",
]
addopts = "-m 'not models and not slow' -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
