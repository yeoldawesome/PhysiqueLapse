# Builds the Windows app and publishes it as a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# -> Releases page gets PhysiqueLapse-0.2.0-Setup.exe (installer) and
#    PhysiqueLapse-0.2.0-portable.zip (unzip and run PhysiqueLapse.exe).
# "Run workflow" on the Actions tab builds the same files as a downloadable artifact without a release.
name: Release Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies (CPU-only PyTorch)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e "backend[dev,desktop]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        shell: pwsh
        working-directory: backend
        run: ..\.venv\Scripts\python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build app, portable zip and installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          .\packaging\build.ps1 -Version $v

      - name: Upload build (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PhysiqueLapse-windows
          path: packaging/out/*
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/out/*-Setup.exe
            packaging/out/*-portable.zip
          generate_release_notes: true
          body: |
            ## Download
            - **PhysiqueLapse-…-Setup.exe**: installer (recommended). No admin rights needed.
            - **PhysiqueLapse-…-portable.zip**: no install; unzip anywhere and run `PhysiqueLapse.exe`.

            Windows 10 or 11 (64-bit). Nothing else to install: the image model runs on your GPU (NVIDIA, AMD or Intel, through DirectML) and falls back to the CPU when there isn't one; video export uses the GPU's encoder when it has one. On first launch the app downloads its pose and face models (~75 MB, one time).
            Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            Your photos stay on your computer, in `%LOCALAPPDATA%\PhysiqueLapse`.
