# PhysiqueLapse on a home server. Copy .env.example to .env and edit it, then:
#
#   docker compose up -d --build
#   docker compose exec physiquelapse python -m app.auth set-password
#
# The port is published on the host's loopback only (127.0.0.1); `tailscale serve` puts HTTPS in
# front of it for your tailnet. Nothing is reachable from the LAN or the internet.
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build  (later)
name: physiquelapse

services:
  physiquelapse:
    build:
      context: .
      target: cpu
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: physiquelapse:cpu
    container_name: physiquelapse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PL_PORT:-8420}:8420"
    volumes:
      - ${PL_DATA_PATH:-/srv/physiquelapse/data}:/data
    environment:
      PL_MODE: server
      TZ: ${TZ:-Etc/UTC}
      PL_CV_WORKERS: ${PL_CV_WORKERS:-1}
      PL_THREADS: ${PL_THREADS:-4}
      PL_JOB_NICE: ${PL_JOB_NICE:-10}
      PL_SESSION_DAYS: ${PL_SESSION_DAYS:-30}
      PL_COOKIE_SECURE: ${PL_COOKIE_SECURE:-true}
      PL_ALLOWED_ORIGINS: ${PL_ALLOWED_ORIGINS:-}
      PL_PUBLIC_URL: ${PL_PUBLIC_URL:-}
      PL_QUOTA_MB: ${PL_QUOTA_MB:-5120}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      OMP_NUM_THREADS: ${PL_THREADS:-4}
    # don't let heavy jobs starve the other apps on this machine
    cpus: ${PL_CPUS:-5}
    mem_limit: ${PL_MEM:-8g}
    memswap_limit: ${PL_MEM:-8g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [pl]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Public address (optional): PhysiqueLapse's OWN Cloudflare Tunnel, separate from anything else
  # on this machine. Started only with:  docker compose --profile public up -d
  # See docs/public-setup.md. It reaches the app over this project's private network; nothing
  # is published on the host for it.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: physiquelapse-tunnel
    profiles: ["public"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # HTTP/2 over TCP: on this home connection QUIC (UDP) streams kept being cancelled and
      # pages crawled at ~1 KB/s; http2 is the tunnel's standard fallback (PL_TUNNEL_PROTOCOL=quic to undo)
      TUNNEL_TRANSPORT_PROTOCOL: ${PL_TUNNEL_PROTOCOL:-http2}
    depends_on:
      physiquelapse:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [pl]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  pl:
    name: physiquelapse
